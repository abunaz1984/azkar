  --ctr-fill: #2c4a7c;
  --ctr-ink: #e9eff8;
  --ctr-num: #f6c777;
  --scrim: rgba(3, 7, 14, .6);
}

:root[data-arfont="naskh"] {
  --ar-font: "Noto Naskh Arabic", "Scheherazade New", "Amiri", "Literata", serif;
  --ar-lh: 1.95;
}

:root[data-arfont="amiri"] {
  --ar-font: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Literata", serif;
  --ar-lh: 2;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html {
  height: 100%;
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;
}

body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-text);
  font-size: 1rem;
  line-height: 1.5;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}

[hidden] { display: none !important; }

button {
  font: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
.card:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

svg.i {
  width: 24px;
  height: 24px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- shell ---------- */
.app {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 640px;
  margin: 0 auto;
  overflow: hidden;
}

.top {
  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;
  padding: max(6px, env(safe-area-inset-top)) 8px 0;
}

/* second header row: where we are in the list (aligned with the progress line below it) */
.top__sub {
  grid-column: 1 / -1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 5px 14px 0;
  line-height: 1.2;
}

.top__pos {
  font-size: 1rem;
  font-weight: 600;
}

.top__done {
  font-size: .8125rem;
  color: var(--muted);
}

.icon-btn {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 14px;
  color: var(--ink);
}

.icon-btn:active { background: var(--raised); }

/* horizon: progress through the whole list */
.horizon {
  position: relative;
  height: 16px;
  margin: 2px 22px 0;
}

.horizon__track {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 3px;
  margin-top: -1.5px;
  border-radius: 2px;
  background: var(--track);
  overflow: hidden;
}

.horizon__fill {
  position: absolute;
  inset: 0;
  transform-origin: 0 50%;
  transform: scaleX(0);
  background: linear-gradient(90deg, var(--dawn-a), var(--sun));
}

.horizon__sun {
  position: absolute;
  top: 50%;
  left: 0;
  width: 12px;
  height: 12px;
  margin: -6px 0 0 -6px;
  border-radius: 50%;
  background: var(--sun);
  box-shadow: 0 0 0 3px var(--bg), 0 0 14px var(--sun-glow);
}

/* the bar only animates after the first paint, so it does not sweep on launch */
.horizon.is-ready .horizon__fill { transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
.horizon.is-ready .horizon__sun { transition: left .5s cubic-bezier(.2, .7, .2, 1); }

/* ---------- card ---------- */
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}

.card {
  position: absolute;
  inset: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  padding: 14px 20px 34px;
  scrollbar-width: thin;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 10px, #000 calc(100% - 26px), transparent);
  mask-image: linear-gradient(to bottom, transparent, #000 10px, #000 calc(100% - 26px), transparent);
}

.card__in {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 100%;
}

.ru {
  margin: 0;
  font-size: 1.125rem;
  line-height: 1.65;
  text-align: left;
  hyphens: auto;
  -webkit-hyphens: auto;
  overflow-wrap: break-word;
}

.note {
  margin: 0;
  font-size: .875rem;
  line-height: 1.5;
  color: var(--muted);
}

.opts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  min-width: 64px;
  min-height: 42px;
  padding: 0 16px;
  border: 1.5px solid var(--line);
  border-radius: 21px;
  font-size: .9375rem;
  font-weight: 600;
  color: var(--ink);
}

.chip[aria-checked="true"] {
  background: var(--chip-on-bg);
  border-color: var(--chip-on-bd);
  color: var(--chip-on-ink);
}

.say {
  display: flex;
  flex: 1 0 auto;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
}

.orn {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--muted);
}

.orn__line {
  flex: 1;
  height: 1px;
  background: var(--line);
}

.orn svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linejoin: round;
}

.ar {
  margin: 0;
  scroll-margin-top: 16px;
  direction: rtl;
  unicode-bidi: isolate;
  text-align: center;
  white-space: pre-line;
  font-family: var(--ar-font);
  font-size: calc(var(--ar-pt) * 1pt);
  line-height: var(--ar-lh);
  font-kerning: normal;
  text-wrap: balance;
  overflow-wrap: break-word;
}

.src {
  margin: 0;
  text-align: center;
  font-size: .8125rem;
  color: var(--muted);
}

.jump {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14px;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 6px;
  width: max-content;
  max-width: calc(100% - 32px);
  min-height: 44px;
  margin: 0 auto;
  padding: 0 18px 0 12px;
  border-radius: 22px;
  background: var(--ink);
  color: var(--bg);
  font-size: .9375rem;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 6px 18px rgba(8, 16, 36, .28);
}

.jump:active { transform: translateY(1px); }

.toast {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 12px;
  z-index: 5;
  max-width: 420px;
  margin: 0 auto;
  padding: 11px 16px;
  border-radius: 14px;
  background: var(--ink);
  color: var(--bg);
  font-size: .9375rem;
  line-height: 1.35;
  text-align: center;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}

.toast.is-on {
  opacity: 1;
  transform: none;
}

/* ---------- dock: navigation and the counter ---------- */
.dock {
  display: grid;
  gap: 10px;
  padding: 10px 14px max(14px, env(safe-area-inset-bottom));
  background: var(--bg);
  box-shadow: 0 -1px 0 var(--line);
}

.nav {
  display: grid;
  grid-template-columns: 1fr 48px 48px 1fr;
  gap: 8px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 48px;
  border-radius: 14px;
  background: var(--raised);
  font-size: 1rem;
  font-weight: 600;
}

.btn:active { background: var(--raised-2); }
.btn:disabled { opacity: .38; cursor: default; }
.btn:disabled:active { background: var(--raised); }

.counter {
  position: relative;
  height: 96px;
  overflow: hidden;
  border-radius: 50% 50% 22px 22px / 30px 30px 22px 22px;
  background: var(--ctr-base);
  color: var(--ctr-ink);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  transition: transform .08s ease-out;
}

.counter:active { transform: translateY(2px); }

.counter__fill {
  position: absolute;
  inset: 0;
  background: var(--ctr-fill);
  transform-origin: 50% 100%;
  transform: scaleY(0);
  transition: transform .22s cubic-bezier(.2, .7, .2, 1);
}

.counter__label {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding-top: 6px;
  font-size: 1.3125rem;
  font-weight: 600;
  pointer-events: none;
}

.counter__txt { white-space: pre; }

.counter__num {
  display: inline-block;
  min-width: .9em;
  font-size: 2.75rem;
  line-height: 1;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ctr-num);
}

.counter__num svg {
  width: 40px;
  height: 40px;
  display: block;
  stroke-width: 2.6;
}

.ripple {
  position: absolute;
  width: 220px;
  height: 220px;
  margin: -110px 0 0 -110px;
  border-radius: 50%;
  background: var(--ctr-num);
  opacity: 0;
  pointer-events: none;
}

/* ---------- finish ---------- */
.finish:focus { outline: none; }

.finish {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background: #0a101e;
  color: #eaf0f8;
  text-align: center;
}

.finish__scene {
  position: relative;
  flex: 0 0 48%;
  min-height: 0;
}

.finish__scene svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.finish__body {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  padding: 16px 24px max(24px, env(safe-area-inset-bottom));
}

.finish__text {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin: auto 0;
  padding: 12px 0;
}

.finish__actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
  margin-top: auto;
}

.finish__title {
  margin: 0;
  max-width: 14em;
  font-size: 1.75rem;
  line-height: 1.2;
  font-weight: 600;
  text-wrap: balance;
}

.finish__stats {
  margin: 0;
  font-size: .9375rem;
  color: #9db0c9;
}

.finish__go {
  width: 100%;
  max-width: 360px;
  min-height: 56px;
  border-radius: 16px;
  background: #f2bc5e;
  color: #2a1a06;
  font-size: 1.125rem;
  font-weight: 600;
}

.finish__go:active { background: #e4a947; }

.finish__back {
  min-height: 48px;
  padding: 0 18px;
  border-radius: 14px;
  font-size: 1rem;
  color: #9db0c9;
}

.finish button:focus-visible { outline-color: #8ab4ff; }

.finish__sun { transform-box: fill-box; transform-origin: 50% 100%; }

/* the finish picture follows the set: sunrise for the morning, sunset and a crescent for the evening */
.finish .sc--e { display: none; }
[data-set="evening"] .finish .sc--m { display: none; }
[data-set="evening"] .finish .sc--e { display: inline; }

/* resting pose of the evening sun: the disc has sunk to the horizon */
.finish__sun-e { transform-box: fill-box; transform: translateY(30px); }

.finish.is-play .finish__sun { animation: sun-rise 1.5s cubic-bezier(.16, .8, .24, 1) both; }
.finish.is-play .finish__sun-e { animation: sun-set 1.8s cubic-bezier(.3, .15, .25, 1) both; }
.finish.is-play .finish__moon { animation: fade-in 1.4s ease-out 1.1s both; }
.finish.is-play .finish__rays { animation: fade-in 1s ease-out .9s both; }
.finish.is-play .finish__body > * { animation: fade-in .7s ease-out .5s both; }

@keyframes sun-rise {
  from { transform: translateY(58px); }
  to { transform: none; }
}

@keyframes sun-set {
  from { transform: translateY(-34px); }
  to { transform: translateY(30px); }
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ---------- sheets ---------- */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: var(--scrim);
}

.sheet__panel {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 640px;
  max-height: 88vh;
  max-height: 88dvh;
  border-radius: 22px 22px 0 0;
  background: var(--bg);
  box-shadow: 0 -1px 0 var(--line);
}

.sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 8px 4px 20px;
}

.sheet__title {
  margin: 0;
  font-size: 1.1875rem;
  font-weight: 600;
}

.sheet__body {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 4px 16px max(20px, env(safe-area-inset-bottom));
}

.row {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 56px;
  padding: 8px 10px;
  border-radius: 12px;
  text-align: left;
}

.row[aria-current="true"] { background: var(--raised); }

.row__n {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}

.row__t {
  font-size: .9375rem;
  line-height: 1.35;
}

.row__s {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  min-width: 44px;
  font-size: .875rem;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}

.row[data-state="done"] .row__s { color: var(--accent); }
.row[data-state="done"] .row__t { color: var(--muted); }
.row__s svg { width: 20px; height: 20px; stroke-width: 2.6; }

.set {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 56px;
  padding: 6px 4px;
  border-bottom: 1px solid var(--line);
}

.set:last-child { border-bottom: 0; }

.set__label {
  font-size: 1rem;
  line-height: 1.3;
}

.set__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.set--stack {
  align-items: stretch;
  flex-direction: column;
  gap: 10px;
  padding: 12px 4px;
}

.preview {
  margin: 0;
  padding: 6px 8px;
  border-radius: 14px;
  background: var(--raised);
  direction: rtl;
  text-align: center;
  font-family: var(--ar-font);
  font-size: calc(var(--ar-pt) * 1pt);
  line-height: var(--ar-lh);
}

.stepper {
  display: flex;
  align-items: center;
  gap: 4px;
}

.stepper__val {
  min-width: 64px;
  text-align: center;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.seg {
  display: flex;
  gap: 6px;
  padding: 4px;
  border-radius: 14px;
  background: var(--raised);
}

.seg__btn {
  flex: 1;
  min-height: 42px;
  padding: 0 8px;
  border-radius: 10px;
  font-size: .9375rem;
  font-weight: 600;
  color: var(--muted);
}

.seg__btn[aria-checked="true"] {
  background: var(--bg);
  color: var(--ink);
  box-shadow: 0 0 0 1px var(--line);
}

/* morning / evening switch in the header */
.seg--set {
  gap: 2px;
  width: 100%;
  max-width: 280px;
  margin: 0 auto;
  padding: 3px;
  border-radius: 16px;
}

.seg--set .seg__btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 42px;
  padding: 0 10px;
  border-radius: 13px;
  font-size: 1rem;
}

.seg--set .seg__btn svg.i {
  width: 18px;
  height: 18px;
}

.seg--set .seg__btn[aria-checked="true"] svg.i { color: var(--accent); }

.switch {
  position: relative;
  flex: none;
  width: 52px;
  height: 32px;
  border-radius: 16px;
  background: var(--raised-2);
  transition: background .15s ease;
}

.switch::after {
  content: "";
  position: absolute;
  top: 4px;
  left: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg);
  box-shadow: 0 0 0 1px var(--line);
  transition: transform .15s ease;
}

.switch[aria-checked="true"] { background: var(--sun); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: #fff; }

.danger {
  width: 100%;
  min-height: 48px;
  margin-top: 8px;
  border-radius: 14px;
  background: var(--raised);
  font-weight: 600;
}

.danger.is-armed {
  background: #b3261e;
  color: #fff;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-delay: 0s !important;
    transition-duration: .01ms !important;
  }
}

@media (orientation: landscape) and (max-height: 520px) {
  .dock {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: center;
    padding-top: 8px;
  }
  .counter { height: 72px; }
  .counter__num { font-size: 2.125rem; }
  .top__done { display: none; }

  /* finish screen: sunrise on the left, text and buttons on the right */
  .finish { flex-direction: row; }
  .finish__scene { flex: 0 0 40%; }
  .finish__body { justify-content: center; padding: 12px 20px; }
  .finish__text { margin: 0; padding: 0; }
  .finish__title { font-size: 1.5rem; }
  .finish__actions { margin-top: 14px; }
  .finish__go { min-height: 50px; }
  .finish__back { min-height: 42px; }
}

@media (max-height: 640px) {
  .counter { height: 84px; }
  .counter__num { font-size: 2.375rem; }
  .card { padding-top: 10px; }
}

<script>
(function () {
  'use strict';

  var DATA = {"morning":[{"n":1,"title":"Сура «аль-Ихляс»","count":3,"note":"В книжке: «Эти суры по порядку читаются 3 раза»","ru":"Именем Аллаха, Милостивого, Милосердного. «Скажи (о, Мухаммад!): „Он — Аллах Единый, Аллах Самодостаточный. Не родил и не был рожден, и нет никого, равного Ему“».","ar":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\nقُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾"},{"n":2,"title":"Сура «аль-Фаляк»","count":3,"ru":"Именем Аллаха, Милостивого, Милосердного. «Скажи (о, Мухаммад!): „Прибегаю к защите Господа рассвета, от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла (колдуний), дующих на узлы, от зла завистника, когда завидует“».","ar":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِنْ شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾"},{"n":3,"title":"Сура «ан-Нас»","count":3,"ru":"Именем Аллаха, Милостивого, Милосердного. «Скажи (о, Мухаммад!): „Прибегаю к защите Господа людей, Царя людей, Бога людей, от зла искусителя исчезающего (при поминании Аллаха), который наущает в груди людей, из числа джиннов и людей“».","ar":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾"},{"n":4,"title":"«Ля иляха илляллаху вахдаху…»","count":100,"options":[100,10,1],"src":"аль-Бухари, Муслим","note":"100 или 10 раз; можно 1 раз, если времени мало.","ru":"Нет божества, достойного поклонения, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, Он властен над всем.","ar":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ"},{"n":5,"title":"«Субханаллахи ва бихамдихи»","count":100,"src":"Муслим","ru":"Слава Аллаху и хвала Ему!","ar":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ"},{"n":6,"title":"«Бисмилляхиль-лязи ля йадурру…»","count":3,"src":"Абу Давуд, ат-Тирмизи, Ибн Маджах","note":"Утром и вечером. По книжке: ничто не повредит тому, кто повторит эти слова.","ru":"С именем Аллаха, с именем которого ничто не причинит вреда ни на земле, ни на небе, ведь Он — Слышащий, Знающий!","ar":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ"},{"n":7,"title":"«Радыйту билляхи Раббан…»","count":3,"src":"Абу Давуд, Ахмад","ru":"Доволен я Аллахом как Господом, Исламом — как религией и Мухаммадом ﷺ — как пророком!","ar":"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا"},{"n":8,"title":"«Хасбийаллаху ля иляха илля хува…»","count":7,"src":"Абу Давуд","ru":"Достаточно мне Аллаха, нет божества, достойного поклонения, кроме Него; на Него я уповаю, и Он — Господь великого Трона.","ar":"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ"},{"n":9,"title":"«Асбахна ‘аля фитратиль-ислам…»","count":1,"src":"ан-Насаи","ru":"Мы дожили до утра в лоне Ислама согласно слову искренности, исповедуя религию нашего Пророка Мухаммада ﷺ и религию нашего отца Ибрахима, который был ханифом и мусульманином и не относился к многобожникам.","ar":"أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ"},{"n":10,"title":"«Асбахна ва асбахаль-мульку лилляхи, валь-хамду лилляхи…»","count":1,"src":"Муслим","ru":"Мы дожили до утра, и этим утром владычество принадлежит Аллаху, и хвала Аллаху. Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, Он властен над всем. Господь мой, прошу Тебя о благе того, что будет в этот день, и благе того, что за ним последует, и прибегаю к Тебе от зла того, что будет в этот день, и зла того, что за ним последует. Господь мой, прибегаю к Тебе от нерадения и старческой дряхлости. Господь мой, прибегаю к Тебе от мучений в Огне и мучений в могиле!","ar":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ"},{"n":11,"title":"«Аллахумма бика асбахна…»","count":1,"src":"ат-Тирмизи","ru":"О, Аллах! Благодаря Тебе мы дожили до утра, и благодаря Тебе мы дожили до вечера. Ты даешь нам жизнь, и Ты лишаешь нас ее, и Ты воскресишь нас для отчета.","ar":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ"},{"n":12,"title":"«Аллахумма инни асбахту ушхидука…»","count":4,"options":[4,3,2,1],"src":"Абу Давуд, ат-Тирмизи","note":"1, 2, 3 или 4 раза. По книжке: Аллах избавит от Огня того, кто так скажет утром или вечером.","ru":"О, Аллах! Поистине, этим утром я призываю Тебя, и тех, кто несет Твой трон, и Твоих ангелов, и всех тех, кого Ты создал, засвидетельствовать, что Ты — Аллах, и нет божества, достойного поклонения, кроме одного лишь Тебя, и нет у Тебя сотоварища, и что Мухаммад — Твой раб и Твой посланник.","ar":"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ"},{"n":13,"title":"«Аллахумма ма асбаха би мин ни‘матин…»","count":1,"src":"Абу Давуд","note":"По книжке: кто скажет это утром, исполнит благодарность за день, кто вечером — за ночь.","ru":"О, Аллах! Милости, оказанные этим утром мне или кому-либо иному из Твоих созданий, исходят только от Тебя, и нет у Тебя сотоварища! Тебе хвала и Тебе благодарность!","ar":"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ"},{"n":14,"title":"«Йа Хайю йа Кайюм…»","count":1,"src":"аль-Хаким","ru":"О Живой, о Вечносущий! Обращаюсь за защитой к милосердию Твоему, приведи в порядок все мои дела и не доверяй меня душе моей ни на мгновение!","ar":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ"},{"n":15,"title":"«Аллахумма ‘афини фи бадани…»","count":3,"src":"Абу Давуд, Ахмад","ru":"О, Аллах! Исцели мое тело! О, Аллах! Исцели мой слух! О, Аллах! Исцели мое зрение, нет божества, достойного поклонения, кроме Тебя! О, Аллах! Поистине, я прибегаю к Тебе от неверия и от бедности, и я прибегаю к Тебе от мучений могилы, нет божества, достойного поклонения, кроме Тебя!","ar":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ"},{"n":16,"title":"«Аллахумма инни асалюкаль-‘афва валь-‘афийата…»","count":1,"src":"Абу Давуд","ru":"О, Аллах! Поистине, я прошу Тебя о прощении и благополучии в мире этом и в мире ином. О, Аллах! Поистине, я прошу Тебя о прощении и благополучии в моей религии, в моих мирских делах, в моей семье и в моем имуществе. О, Аллах! Прикрой мою наготу и огради меня от страха. О, Аллах! Защити меня спереди, и сзади, и справа, и слева, и сверху, и я прибегаю к величию Твоему от того, чтобы быть убитым снизу!","ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي، وَعَنْ يَمِينِي وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي"},{"n":17,"title":"«Аллахумма ‘алималь-гайби ваш-шахадати…»","count":1,"src":"ат-Тирмизи","ru":"О, Аллах, Знающий сокровенное и явное, Творец небес и земли, Господь и Владыка всего, свидетельствую, что нет божества, достойного поклонения, кроме Тебя, прибегаю к Тебе от зла души своей, от зла и многобожия шайтана и от того, чтобы причинить зло самому себе или навлечь его на какого-нибудь мусульманина.","ar":"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ"},{"n":18,"title":"«Аллахумма инни асалюка ‘ильман нафи‘ан…»","count":1,"src":"Ибн Маджах","ru":"О, Аллах! Поистине, я прошу у Тебя знания полезного, удела благого и деяния, которое будет принято!","ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا"},{"n":19,"title":"Сайид аль-истигфар «Аллахумма анта Рабби…»","count":1,"src":"аль-Бухари","note":"По книжке: кто произнесет эти слова с верой, войдет в Рай или станет одним из его обитателей.","ru":"О, Аллах! Ты — Господь мой, и нет божества, достойного поклонения, кроме Тебя. Ты создал меня, а я — Твой раб, и я буду хранить верность Тебе, пока у меня хватит сил. Прибегаю к Тебе от зла того, что я сделал, признаю милость, оказанную Тобой мне, и признаю грех свой. Прости же меня, ибо, поистине, никто не прощает грехов, кроме Тебя!","ar":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ"},{"n":20,"title":"«Асбахна ва асбахаль-мульку лилляхи Раббиль-‘алямин…»","count":1,"src":"Абу Давуд","ru":"Мы дожили до утра, и этим утром владычество принадлежит Аллаху, Господу миров. О, Аллах! Поистине, я прошу Тебя о благе этого дня: о помощи и победе, о свете, благодати и руководстве в этот день, и прибегаю к Тебе от зла того, что в нем, и зла того, что за ним последует.","ar":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ: فَتْحَهُ، وَنَصْرَهُ، وَنُورَهُ، وَبَرَكَتَهُ، وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ"},{"n":21,"title":"«Астагфируллаха ва атубу иляйх»","count":100,"src":"аль-Бухари, Муслим","note":"100 раз в день.","ru":"Прошу прощения у Аллаха и приношу Ему свое покаяние.","ar":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ"},{"n":22,"title":"«Субханаллахи ва бихамдихи: ‘адада халькихи…»","count":3,"src":"Муслим","ru":"Слава Аллаху и хвала Ему столько раз, сколько существует Его творений, и столько раз, сколько будет Ему угодно, пусть вес этих славословий и похвал будет равен весу Его трона и пусть для записи их потребуется столько же чернил, сколько нужно их для записи слов Его!","ar":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ: عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ"},{"n":23,"title":"«Аллахумма салли ва саллим ‘аля набийина Мухаммад»","count":10,"src":"ат-Табарани","ru":"О, Аллах! Благослови нашего Пророка Мухаммада и приветствуй его!","ar":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ"}],"evening":[{"n":1,"title":"Сура «аль-Ихляс»","count":3,"note":"По указанию книжки на стр. 26: «Вначале читаются суры «аль-Ихляс», «аль-Фаляк», «ан-Нас», 3 раза подряд»","ru":"Именем Аллаха, Милостивого, Милосердного. «Скажи (о, Мухаммад!): „Он — Аллах Единый, Аллах Самодостаточный. Не родил и не был рожден, и нет никого, равного Ему“».","ar":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\nقُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾"},{"n":2,"title":"Сура «аль-Фаляк»","count":3,"ru":"Именем Аллаха, Милостивого, Милосердного. «Скажи (о, Мухаммад!): „Прибегаю к защите Господа рассвета, от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла (колдуний), дующих на узлы, от зла завистника, когда завидует“».","ar":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِنْ شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾"},{"n":3,"title":"Сура «ан-Нас»","count":3,"ru":"Именем Аллаха, Милостивого, Милосердного. «Скажи (о, Мухаммад!): „Прибегаю к защите Господа людей, Царя людей, Бога людей, от зла искусителя исчезающего (при поминании Аллаха), который наущает в груди людей, из числа джиннов и людей“».","ar":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾"},{"n":4,"title":"«Ля иляха илляллаху вахдаху…»","count":100,"options":[100,10,1],"src":"аль-Бухари, Муслим","note":"100 или 10 раз; можно 1 раз, если времени мало.","ru":"Нет божества, достойного поклонения, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, Он властен над всем.","ar":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ"},{"n":5,"title":"«Субханаллахи ва бихамдихи»","count":100,"src":"Муслим","ru":"Слава Аллаху и хвала Ему!","ar":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ"},{"n":6,"title":"«Бисмилляхиль-лязи ля йадурру…»","count":3,"src":"Абу Давуд, ат-Тирмизи, Ибн Маджах","note":"Утром и вечером. По книжке: ничто не повредит тому, кто повторит эти слова.","ru":"С именем Аллаха, с именем которого ничто не причинит вреда ни на земле, ни на небе, ведь Он — Слышащий, Знающий!","ar":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ"},{"n":7,"title":"«А‘узу бикалиматиль-ляхит-таммати мин шарри ма халяк»","count":3,"src":"ат-Тирмизи","ru":"Прибегаю к совершенным словам Аллаха от зла того, что Он сотворил.","ar":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ"},{"n":8,"title":"«Радыйту билляхи Раббан…»","count":3,"src":"Абу Давуд, Ахмад","ru":"Доволен я Аллахом как Господом, Исламом — как религией и Мухаммадом ﷺ — как пророком!","ar":"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا"},{"n":9,"title":"«Хасбийаллаху ля иляха илля хува…»","count":7,"src":"Абу Давуд","ru":"Достаточно мне Аллаха, нет божества, достойного поклонения, кроме Него; на Него я уповаю, и Он — Господь великого Трона.","ar":"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ"},{"n":10,"title":"«Амсайна ‘аля фитратиль-ислам…»","count":1,"src":"ан-Насаи","ru":"Мы дожили до вечера в лоне Ислама согласно слову искренности, исповедуя религию нашего Пророка Мухаммада ﷺ и религию нашего отца Ибрахима, который был ханифом и мусульманином и не относился к многобожникам.","ar":"أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ"},{"n":11,"title":"«Амсайна ва амсаль-мульку лилляхи, валь-хамду лилляхи…»","count":1,"src":"Муслим","ru":"Мы дожили до вечера, и этим вечером владычество принадлежит Аллаху, и хвала Аллаху. Нет божества, достойного поклонения, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, Он властен над всем. Господь мой, прошу Тебя о благе того, что будет в эту ночь, и благе того, что за ней последует, и прибегаю к Тебе от зла того, что будет в эту ночь, и зла того, что за ней последует. Господь мой, прибегаю к Тебе от нерадения и старческой дряхлости. Господь мой, прибегаю к Тебе от мучений в Огне и мучений в могиле!","ar":"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ"},{"n":12,"title":"«Аллахумма бика амсайна…»","count":1,"src":"ат-Тирмизи","ru":"О, Аллах! Благодаря Тебе мы дожили до вечера, и благодаря Тебе мы дожили до утра. Ты даешь нам жизнь, и Ты лишаешь нас ее, и к Тебе — возвращение.","ar":"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ"},{"n":13,"title":"«Аллахумма инни амсайту ушхидука…»","count":4,"options":[4,3,2,1],"src":"Абу Давуд, ат-Тирмизи","note":"1, 2, 3 или 4 раза. По книжке: Аллах избавит от Огня того, кто так скажет утром или вечером.","ru":"О, Аллах! Поистине, этим вечером я призываю Тебя, и тех, кто несет Твой трон, и Твоих ангелов, и всех тех, кого Ты создал, засвидетельствовать, что Ты — Аллах, и нет божества, достойного поклонения, кроме одного лишь Тебя, и нет у Тебя сотоварища, и что Мухаммад — Твой раб и Твой посланник.","ar":"اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ"},{"n":14,"title":"«Аллахумма ма амса би мин ни‘матин…»","count":1,"src":"Абу Давуд","note":"По книжке: кто скажет это утром, исполнит благодарность за день, кто вечером — за ночь.","ru":"О, Аллах! Милости, оказанные этим вечером мне или кому-либо иному из Твоих созданий, исходят только от Тебя, и нет у Тебя сотоварища! Тебе хвала и Тебе благодарность!","ar":"اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ"},{"n":15,"title":"«Йа Хайю йа Кайюм…»","count":1,"src":"аль-Хаким","ru":"О Живой, о Вечносущий! Обращаюсь за защитой к милосердию Твоему, приведи в порядок все мои дела и не доверяй меня душе моей ни на мгновение!","ar":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ"},{"n":16,"title":"«Аллахумма ‘афини фи бадани…»","count":3,"src":"Абу Давуд, Ахмад","ru":"О, Аллах! Исцели мое тело! О, Аллах! Исцели мой слух! О, Аллах! Исцели мое зрение, нет божества, достойного поклонения, кроме Тебя! О, Аллах! Поистине, я прибегаю к Тебе от неверия и от бедности, и я прибегаю к Тебе от мучений могилы, нет божества, достойного поклонения, кроме Тебя!","ar":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ"},{"n":17,"title":"«Аллахумма инни асалюкаль-‘афва валь-‘афийата…»","count":1,"src":"Абу Давуд","ru":"О, Аллах! Поистине, я прошу Тебя о прощении и благополучии в мире этом и в мире ином. О, Аллах! Поистине, я прошу Тебя о прощении и благополучии в моей религии, в моих мирских делах, в моей семье и в моем имуществе. О, Аллах! Прикрой мою наготу и огради меня от страха. О, Аллах! Защити меня спереди, и сзади, и справа, и слева, и сверху, и я прибегаю к величию Твоему от того, чтобы быть убитым снизу!","ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي، وَعَنْ يَمِينِي وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي"},{"n":18,"title":"«Аллахумма ‘алималь-гайби ваш-шахадати…»","count":1,"src":"ат-Тирмизи","ru":"О, Аллах, Знающий сокровенное и явное, Творец небес и земли, Господь и Владыка всего, свидетельствую, что нет божества, достойного поклонения, кроме Тебя, прибегаю к Тебе от зла души своей, от зла и многобожия шайтана и от того, чтобы причинить зло самому себе или навлечь его на какого-нибудь мусульманина.","ar":"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ"},{"n":19,"title":"Сайид аль-истигфар «Аллахумма анта Рабби…»","count":1,"src":"аль-Бухари","note":"По книжке: кто произнесет эти слова с верой, войдет в Рай или станет одним из его обитателей.","ru":"О, Аллах! Ты — Господь мой, и нет божества, достойного поклонения, кроме Тебя. Ты создал меня, а я — Твой раб, и я буду хранить верность Тебе, пока у меня хватит сил. Прибегаю к Тебе от зла того, что я сделал, признаю милость, оказанную Тобой мне, и признаю грех свой. Прости же меня, ибо, поистине, никто не прощает грехов, кроме Тебя!","ar":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ"},{"n":20,"title":"«Амсайна ва амсаль-мульку лилляхи Раббиль-‘алямин…»","count":1,"src":"Абу Давуд","ru":"Мы дожили до вечера, и этим вечером владычество принадлежит Аллаху, Господу миров. О, Аллах! Поистине, я прошу Тебя о благе этой ночи: о помощи и победе, о свете, благодати и руководстве в эту ночь, и прибегаю к Тебе от зла того, что в ней, и зла того, что за ней последует.","ar":"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذِهِ اللَّيْلَةِ: فَتْحَهَا، وَنَصْرَهَا، وَنُورَهَا، وَبَرَكَتَهَا، وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهَا وَشَرِّ مَا بَعْدَهَا"},{"n":21,"title":"«Аллахумма салли ва саллим ‘аля набийина Мухаммад»","count":10,"src":"ат-Табарани","ru":"О, Аллах! Благослови нашего Пророка Мухаммада и приветствуй его!","ar":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ"}]};           // {morning: [...], evening: [...]}

  /* day rollover, morning/evening choice, wake lock, theme */
  function checkDate() {
    var t = today(), stale = false;
    SETS.forEach(function (s) {
      if (states[s].date !== t) { states[s] = freshState(s); hists[s] = []; stale = true; }
    });
    if (!stale) return;
    state = states[cur];
    hist = hists[cur];
    hideFinish();
    render(true);
    save();
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      var last = lsJSON(LKEY, null);     // read before anything refreshes it
      checkDate();
      var want = pickSet(last);          // coming back after a long pause: morning or evening by the clock
      if (want !== cur) switchSet(want, true);
      acquireWake();
    } else { save(); saveSettings(); }
  });
  window.addEventListener('pagehide', function () { save(); saveSettings(); });
  try {
    var mqDark = window.matchMedia('(prefers-color-scheme: dark)');
    if (mqDark.addEventListener) mqDark.addEventListener('change', applyTheme);
  } catch (e) { /* ignore */ }

  /* ---------- installable PWA (only when served over http/https) ---------- */
  function setupPWA() {
    var icon = ICONS.i192;
    if (icon && !document.querySelector('link[rel="icon"]')) {
      var fav = document.createElement('link');
      fav.rel = 'icon'; fav.type = 'image/png'; fav.href = icon;
      document.head.appendChild(fav);
      var ati = document.createElement('link');
      ati.rel = 'apple-touch-icon'; ati.href = icon;
      document.head.appendChild(ati);
    }
    if (!/^https?:$/.test(location.protocol)) return;
    // hosted bundle: manifest.webmanifest sits next to the page; single file: build the manifest on the fly
    if (!document.querySelector('link[rel="manifest"]')) try {
      var base = location.href.split('#')[0].split('?')[0];
      var scope = base.replace(/[^\/]*$/, '');
      var mf = {
        id: base, name: 'Азкары: утро и вечер', short_name: 'Азкары', lang: 'ru', dir: 'ltr',
        start_url: base, scope: scope, display: 'standalone', orientation: 'portrait',
        background_color: '#0e1729', theme_color: '#0e1729',
        icons: [
          { src: ICONS.i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
          { src: ICONS.i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
        ]
      };
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
      document.head.appendChild(link);
    } catch (e) { /* ignore */ }
    if ('serviceWorker' in navigator) {
      // A new version of the app arrived in the background: reload once so it shows right away.
      // Never on the very first visit, never while somebody is touching the screen (it waits for the next
      // return to the app instead), never more than once a minute. Progress is saved before the reload.
      var hadController = !!navigator.serviceWorker.controller;
      var swReg = null, reloaded = false, waiting = false, lastCheck = Date.now();
      var RKEY = 'azkar.v1.reloadAt';
      var recentReload = function () {
        try { return Date.now() - (+sessionStorage.getItem(RKEY) || 0) < 60000; } catch (e) { return false; }
      };
      var reloadIfIdle = function () {
        if (reloaded || recentReload()) return;
        if (performance.now() - lastTouch < 5000) { waiting = true; return; }
        reloaded = true; waiting = false;
        try { sessionStorage.setItem(RKEY, String(Date.now())); } catch (e) { /* ignore */ }
        save(); saveSettings();
        location.reload();
      };
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadController) reloadIfIdle(); });
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'azkary-updated') reloadIfIdle();
      });
      var checkForUpdate = function () {
        lastCheck = Date.now();
        try { swReg.update().catch(function () { /* offline */ }); } catch (e) { /* ignore */ }
      };
      // coming back to the app (it is often resumed, not reopened): apply what was skipped, or look for news
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible') return;
        if (waiting) reloadIfIdle();
        else if (swReg && Date.now() - lastCheck > 30000) checkForUpdate();
      });
      navigator.serviceWorker.register('sw.js', { scope: './' }).then(function (reg) {
        swReg = reg;
        checkForUpdate();
      }, function () { /* no sw.js next to the page */ });
    }
  }

  /* ---------- start ---------- */
  el.preview.textContent = DATA.morning[0].ar.split('\n')[0];
  if (!navigator.vibrate) el.rowVib.hidden = true;
  if (!navigator.wakeLock) el.rowWake.hidden = true;
  applyAll();
  syncSetUI();
  render(true);
  requestAnimationFrame(function () { requestAnimationFrame(function () { el.horizon.classList.add('is-ready'); }); });
  if (state.finished) showFinish(true);
  setupPWA();
  acquireWake();
  if (!storageWorks()) {
    setTimeout(function () {
      toast('Браузер не сохраняет данные для этого файла: прогресс пропадёт при закрытии.', 6000);
    }, 700);
  }
})();
